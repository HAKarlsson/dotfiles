[font]
size = 12.0

[font.normal]
family = 'Source Code Pro'
[colors.primary]
background = '#ffffff'
foreground = '#000000'

[colors.normal]
black   = '#000000'
red     = '#870000'
green   = '#008700'
yellow  = '#af5f00'
blue    = '#005faf'
magenta = '#870087'
cyan    = '#008787'
white   = '#bcbcbc'

[colors.bright]
black   = '#6c6c6c'
red     = '#d70000'
green   = '#00af00'
yellow  = '#d78700'
blue    = '#0087d7'
magenta = '#af00af'
cyan    = '#00afaf'
white   = '#e4e4e4'

[colors.cursor]
text   = '#ffffff'
cursor = '#000000'

[colors.selection]
text       = '#000000'
background = '#afd7d7'
